kind = "web"
previewPath = "/"
title = "Newsletter Digest"
version = "1.0.0"
id = "artifacts/newsletter-digest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22643

[services.development]
run = "pnpm --filter @workspace/newsletter-digest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/newsletter-digest", "run", "build" ]
publicDir = "artifacts/newsletter-digest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22643"
BASE_PATH = "/"
